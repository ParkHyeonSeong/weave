<!DOCTYPE html>

  <title>Weave — Offline · 오프라인</title>
  <!--
    서비스워커(public/sw.js)의 오프라인 폴백. 세 제약이 설계를 결정한다.
    1) CSP가 적용된다 — middleware.js의 matcher가 이 파일을 제외하지 않고 cache.add가
       헤더까지 저장한다. script-src에 'unsafe-inline'이 없어 인라인 onclick은 안 돌고,
       캐시된 nonce는 설치 시점의 죽은 값이라 nonce 붙인 script 태그도 불가능하다.
       → Retry는 <a href="">. sw.js가 리다이렉트 없이 본문만 치환하므로
         document.URL은 원래 가려던 주소다.
    2) 서브리소스는 SW가 안 가로챈다(fetch는 mode==='navigate'만, 프리캐시는 이 파일 1건).
       → 로고는 data URI 인라인 (img-src가 data: 허용).
    3) _themes.scss를 import 할 수 없다(빌드 밖 정적 자산 + 오프라인에서 추가 요청 실패).
       → 다크 값은 복제본이고 여기만 OS의 prefers-color-scheme을 따른다(의도된 예외).
         library/edgeSurfaces.test.js가 그 복제본의 drift를 막는다.
    ⚠️ 라이트 accent는 사용자 결정 P12 = B-1이다. 이전 값은 잉크 위 대비 4.4669로
       WCAG SC 1.4.3 (AA) 미달이었다. 아래 --off-accent / --off-accent-hover 값으로
       바꿔 기본 6.2875, hover 7.9031을 확보했다. 잉크와 다크 6값은 무변경이다.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --off-bg: #f8f9fa;
      --off-text: #374151;
      --off-muted: #6b7280;

      --off-accent-hover: #4338CA;
      --off-accent-ink: #FFFFFF;

        --off-text: #E6E8EB;

        --off-accent-hover: #8B98F0;
        --off-accent-ink: #0E0F11;
      }

    }
    /* 아래 레이아웃 규칙은 현행 파일과 동일하다 — 색만 var()로 바뀌었다. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: var(--off-bg); color: var(--off-text);
    }
    .container { text-align: center; padding: 2rem; }
    .icon { width: 80px; height: 80px; margin: 0 auto 1.5rem; opacity: 0.5; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { font-size: 0.95rem; color: var(--off-muted); margin-bottom: 1.5rem; }
    .retry {
      display: inline-block; padding: 0.6rem 1.5rem; border: none; border-radius: 6px;
      font-size: 0.9rem; text-decoration: none; cursor: pointer;
      background: var(--off-accent); color: var(--off-accent-ink);
    }
    .retry:hover { background: var(--off-accent-hover); }
    .retry:focus-visible { outline: 2px solid var(--off-accent); outline-offset: 2px; }
    /* 오프라인에서는 런타임 locale을 알 수 없어 두 언어를 함께 보여준다. */
    .alt { display: block; font-size: 13px; color: var(--off-muted); font-weight: 400; margin-top: 4px; }
    .alt-inline { margin-left: 6px; opacity: 0.85; }
  </style>
</head>
