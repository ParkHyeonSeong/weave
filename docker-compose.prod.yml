services:
  # -- Nginx (reverse proxy) ------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: weave-nginx
    # 기본은 127.0.0.1에만 바인딩 — 같은 서버의 nginx(TLS 종단)만 이 포트에 닿는다. 그래야
    # default.conf의 set_real_ip_from(172.16/12 = 도커 브리지)이 "서버 nginx가 넘긴 연결"과 같아져
    # X-Forwarded-For 신뢰가 외부에서 악용될 수 없다. 다른 호스트의 프록시가 붙어야 하면
    # .env.production에서 EXPOSE_BIND=0.0.0.0 으로 열고 방화벽으로 13000을 제한할 것.
    ports:
      - "${EXPOSE_BIND:-127.0.0.1}:${EXPOSE_PORT:-13000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weave-network

  # -- Backend (FastAPI) ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weave-backend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # 신뢰 프록시(CFG-01) — docker 브리지 대역(172.16/12)+루프백만. backend는 내부 전용
      # (expose)이라 이 네트워크의 nginx만 도달한다. 호스트 LAN에 흔한 10/8·192.168/16은
      # 의도적으로 제외(그 대역을 신뢰하면 동일 LAN 호스트가 X-Real-IP를 위조할 여지). docker
      # 기본 주소풀(172.x)이 아니거나 backend를 공개망에 직접 노출하면 .env.production에서
      # TRUSTED_PROXIES를 실제 nginx 대역/IP로 명시하라.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      - DEBUG=${DEBUG:-false}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@weave.local}
      - ENCRYPT_KEY=${ENCRYPT_KEY}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - backend-uploads:/app/uploads
    # ⚠️ 워커는 반드시 1개다. 실시간 협업 방(library/ws_collab_manager.py)과 알림·채팅 연결
    # (library/ws_manager.py)이 프로세스 메모리에 있어, 워커가 2개 이상이면 같은 문서를 연 사람들이
    # 서로 다른 방에 갇히고(상대 편집이 안 보임) 방마다 전체 상태로 DB를 덮어써 입력이 사라진다.
    # WEB_CONCURRENCY 같은 기본값 변경에 흔들리지 않게 --workers 1을 명시한다. 늘리려면 먼저
    # 프로세스 간 동기화(예: Redis pub/sub)가 필요하다.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - weave-network

  # -- Frontend (Next.js) --------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: weave-frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weave-network

  # -- Database (PostgreSQL) -----------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: weave-db
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-weave}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-weave}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weave} -d ${POSTGRES_DB:-weave}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - weave-network

volumes:
  postgres-data:
  backend-uploads:

networks:
  weave-network:
    driver: bridge
