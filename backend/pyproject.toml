[project]
name = "weave-backend"
version = "0.1.0"
description = "Weave - In-house project management platform API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "starlette>=1.0.1",  # FastAPI 전이 의존 — BadHost(Host 헤더 미검증) CVE 패치 하한
    "uvicorn[standard]>=0.41.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.1.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30.0",
    "alembic>=1.15.2",
    "bcrypt>=4.0.0",
    "PyJWT>=2.13.0",  # 빈 HMAC 키 거부 등 CVE 패치 하한 (인증 핵심)
    "python-multipart>=0.0.20",
    "pycrdt>=0.12",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "pywebpush>=2.3.0",
    "aiohttp>=3.14.0",  # pywebpush 전이 의존 — CookieJar 역직렬화/리다이렉트 쿠키 누설 CVE 패치 하한
    "slowapi>=0.1.9",
    "defusedxml>=0.7.1",
    "nh3>=0.2.18",  # 서버측 HTML sanitize(SEC-17) — Rust ammonia 바인딩
    "markdownify>=1.1.0",     # HTML→Markdown egress (WEAVE-36)
    "markdown-it-py>=3.0.0",  # Markdown→HTML ingress — breaks=True로 frontend marked dialect 일치
    "mdit-py-plugins>=0.4.2", # tasklists + dollarmath($..$/$$..$$ 수식)
    "cryptography>=43.0.0",  # crypto.py Fernet의 런타임 의존(그간 pywebpush 통한 전이적 설치)을 직접 선언 + GitHub App RS256 JWT
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
]
migration = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "psycopg2-binary>=2.9.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
