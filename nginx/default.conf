upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # 실제 클라이언트 IP 복원 (CFG-01, 2단 프록시). 운영에서는 서버 nginx(TLS 종단)가 이 컨테이너
    # nginx로 넘겨주므로 $remote_addr는 도커 브리지 게이트웨이가 된다. 그대로 두면 아래 X-Real-IP가
    # 모든 사용자에게 같은 게이트웨이 주소가 되어 백엔드의 per-IP 레이트리밋(로그인 5/분 등)을
    # 전원이 공유하고 로그인 로그의 IP도 무의미해진다. 도커 브리지 대역에서 온 연결에 한해
    # X-Forwarded-For를 신뢰해(오른쪽부터, 신뢰 대역은 건너뛰며) $remote_addr를 실제 클라이언트로
    # 바꾼다. 대역은 backend TRUSTED_PROXIES 기본값(docker-compose.prod.yml)과 같다 — 도커 주소풀이
    # 다르면 둘 다 바꿀 것. ⚠️ 이 신뢰는 "13000에 서버 nginx만 붙는다"는 전제에 기댄다 — 기본
    # 127.0.0.1 바인딩(docker-compose.prod.yml EXPOSE_BIND)이 그 전제를 보장한다. 도커의 포트 발행은
    # 외부 연결도 브리지 대역 주소로 보이게 할 수 있으므로, EXPOSE_BIND를 넓히면 반드시 방화벽으로
    # 13000을 프록시에만 허용해야 한다.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 20M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy는 Next.js 미들웨어(frontend/middleware.js)가 per-request nonce와
    # 함께 동적으로 설정한다(SEC-22 — script-src에서 unsafe-inline 제거). nginx 정적 헤더로는
    # nonce를 줄 수 없어 여기서 CSP를 두지 않는다. 나머지 보안 헤더는 nginx가 계속 담당.

    # Backend API (/api/*)
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for: 클라이언트가 보낸 XFF를 그대로 통과시키지 않고
        # 실제 피어($remote_addr)를 가장 오른쪽에 덧붙인다 — 헤더 위조로 IP를 사칭하지
        # 못하게 한다(CFG-01). 백엔드는 신뢰 프록시 뒤에서만 이 값을 신뢰한다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (채팅, 캔버스 협업)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend (나머지 전부)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for: 클라이언트가 보낸 XFF를 그대로 통과시키지 않고
        # 실제 피어($remote_addr)를 가장 오른쪽에 덧붙인다 — 헤더 위조로 IP를 사칭하지
        # 못하게 한다(CFG-01). 백엔드는 신뢰 프록시 뒤에서만 이 값을 신뢰한다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
